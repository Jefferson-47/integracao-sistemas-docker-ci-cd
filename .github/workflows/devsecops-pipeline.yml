name: FastOrder DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  VERSAO_PYTHON: '3.12'
  IMAGEM_DOCKER: fastorder-api

jobs:
  qualidade-e-sast:
    name: Testes Unitários e SAST (Bandit)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.VERSAO_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Linter PEP8 (Flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Testes Automatizados (Pytest)
        run: pytest -v

      - name: Scan SAST - Análise Estática de Segurança (Bandit)
        run: bandit -r . -lll -f txt

  seguranca-dependencias:
    name: SCA - Auditoria de Dependências (pip-audit)
    runs-on: ubuntu-24.04
    needs: qualidade-e-sast

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python ${{ env.VERSAO_PYTHON }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.VERSAO_PYTHON }}

      - name: Instalar pip-audit
        run: pip install pip-audit

      - name: Auditar vulnerabilidades em requirements.txt
        run: pip-audit -r requirements.txt

  build-e-scan-container:
    name: Build Docker & Scan de Vulnerabilidades (Trivy)
    runs-on: ubuntu-24.04
    needs: [qualidade-e-sast, seguranca-dependencias]
    if: always()

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Build da Imagem Docker
        run: docker build -t ${{ env.IMAGEM_DOCKER }}:${{ github.sha }} .

      - name: Scan de Segurança na Imagem (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.IMAGEM_DOCKER }}:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'